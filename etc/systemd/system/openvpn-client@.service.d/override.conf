# System file, tracked here for reproducibility. Install with:
#   sudo install -D -m 0644 -T \
#     ~/.config/etc/systemd/system/openvpn-client@.service.d/override.conf \
#     /etc/systemd/system/openvpn-client@.service.d/override.conf
#   sudo systemctl daemon-reload
# `vpn doctor` checks it is installed and in sync.
#
# Two things the stock openvpn-client@.service does not do:
#   1. It has no Restart= at all (unlike openvpn@.service, which has
#      Restart=on-failure), so nothing supervises the client.
#   2. It reads /etc/openvpn/client/%i.conf with ProtectHome=true, but the
#      configs live in ~/Sync/vpn.

[Unit]
# With no Restart=, systemd's rate limiter never mattered. With Restart=always
# it does, and a genuinely offline laptop (hotel, captive portal) must not be
# able to latch the unit into "start request repeated too quickly", which would
# need a manual `systemctl reset-failed`. RestartSec keeps the loop cheap.
StartLimitIntervalSec=0

[Service]
# always, not on-failure: a stray `sudo kill` exits 0 and should be undone.
# An explicit `systemctl stop` is still honoured either way.
Restart=always
# Must be explicit; DefaultRestartUSec is 100ms, which would be a hot loop.
RestartSec=10s
TimeoutStopSec=15s

# Configs stay in ~/Sync/vpn, so $HOME has to be visible. read-only, not false.
ProtectHome=read-only
WorkingDirectory=/home/sol/Sync/vpn

# Repoint at ~/Sync/vpn/<instance>.ovpn instead of /etc/openvpn/client/%i.conf.
#
# --script-security must come after --config: openvpn takes the last occurrence
# of a scalar option, so this overrides anything the config sets. That is the
# point -- the configs are Syncthing-writable, so a tampered .ovpn must not be
# able to grant itself level 2 and run `up /tmp/evil` as root.
#
# Level 1, not 0. Level 1 is openvpn's own default: built-in helpers only, no
# user-defined scripts. Level 0 forbids external programs entirely, which
# breaks /usr/libexec/openvpn/dns-updown --
#   WARNING: Failed running dns updown: disallowed by script-security setting
# -- so the pushed `dhcp-option DNS` servers are silently never installed and
# names resolve outside the tunnel. Verified the hard way; do not "harden"
# this back to 0.
#
# Note this still does not block `plugin`, which has no script_security gate.
# Defence in depth over a synced config, not a guarantee.
ExecStart=
ExecStart=/usr/sbin/openvpn --suppress-timestamps --nobind --config /home/sol/Sync/vpn/%i.ovpn --script-security 1

# If openvpn is ever SIGKILLed past TimeoutStopSec it cannot run tun_abort(),
# leaving tap0 up with the 0.0.0.0/1 route -- the exact wedged state this whole
# change exists to prevent. The `-` makes the normal case (already gone) a no-op.
ExecStopPost=-/usr/sbin/ip link delete tap0
