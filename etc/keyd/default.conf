# HP Envy x360 14-fa0: Fn+arrows are invisible to the OS, so the Copilot key
# (sends leftmeta+leftshift+f23) is used as a navigation layer instead.
# Install: bin/install-keyd

[ids]
# built-in keyboard only (AT Translated Set 2)
0001:0001

[main]
leftshift+leftmeta+f23 = layer(nav)

[nav]
left = home
right = end
up = pageup
down = pagedown
