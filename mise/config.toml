[tools]
codex = "latest"
eza = "latest"
neovim = "latest"
starship = "latest"
zoxide = "latest"
delta = "latest"
yazi = "latest"
ripgrep-all = "latest"
lazygit = "latest"
gh = "latest"
bottom = "latest"
rust = "latest"
# built from source: prebuilt binaries (mason, npm, aqua) need newer glibc than EL9
"cargo:tree-sitter-cli" = "latest"
nodejs = "lts"
antigravity-cli = "latest"
glab = "latest"
bat = "latest"
claude = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
kubectl = "latest"
yt-dlp = "latest"
tealdeer = "latest"
dust = "latest"
# linters for `mise run check` in ~/.config
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"
gitleaks = "latest"
rumdl = "latest"
actionlint = "latest"
herdr = "latest"
ghq = "latest"
rclone = "latest"

[settings]
# skip the default 24h minimum_release_age delay for these tools
minimum_release_age_excludes = ["claude"]
