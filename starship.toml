"$schema" = 'https://starship.rs/config-schema.json'

# Mirrors claude/statusline.sh: sol🌐host 📂dir 🍁branch [status]
# Restyles the leading modules only; $all keeps every other default module
# (languages, cmd_duration, jobs, status, ...) in its default place.
format = """
$username$hostname ${custom.dir} ${custom.git_mark}$git_branch$git_state$git_status$all"""

# Hide the "via <lang> <version>" modules (languages, toolchains, envs)
bun.disabled = true
c.disabled = true
cmake.disabled = true
cobol.disabled = true
conda.disabled = true
cpp.disabled = true
crystal.disabled = true
daml.disabled = true
dart.disabled = true
deno.disabled = true
docker_context.disabled = true
dotnet.disabled = true
elixir.disabled = true
elm.disabled = true
erlang.disabled = true
fennel.disabled = true
fortran.disabled = true
gleam.disabled = true
golang.disabled = true
gradle.disabled = true
guix_shell.disabled = true
haskell.disabled = true
haxe.disabled = true
helm.disabled = true
java.disabled = true
julia.disabled = true
kotlin.disabled = true
lua.disabled = true
maven.disabled = true
memory_usage.disabled = true
meson.disabled = true
nim.disabled = true
nix_shell.disabled = true
nodejs.disabled = true
ocaml.disabled = true
odin.disabled = true
opa.disabled = true
perl.disabled = true
php.disabled = true
