[username]
show_always = true
format = '[$user]($style)'

[hostname]
ssh_only = true
format = '🌐[$hostname]($style)'

# Emoji by location (the directory module can't switch symbols per path):
# 🚀 ~/prj/hiqdev, 👤 ~/prj/hiqsol (me), 🧰 ~/prj and other vendors, 🏠 ~,
# 📂 elsewhere, 🔒 instead of any of them when read-only.
# All but the last component are cut to 1 char, fish-style: 🚀hipanel/s/models
[directory]
disabled = true

[custom.dir]
when = true
shell = ['sh']
command = '''
case $PWD in
  "$HOME"/prj/hiqdev|"$HOME"/prj/hiqdev/*) e=🚀 p=${PWD#"$HOME"/prj/hiqdev} p=${p#/} ;;
  "$HOME"/prj/hiqsol|"$HOME"/prj/hiqsol/*) e=👤 p=${PWD#"$HOME"/prj/hiqsol} p=${p#/} ;;
  "$HOME"/prj|"$HOME"/prj/*) e=🧰 p=${PWD#"$HOME"/prj} p=${p#/} ;;
  "$HOME"|"$HOME"/*) e=🏠 p=${PWD#"$HOME"} p=${p#/} ;;
  *) e=📂 p=$PWD ;;
esac
[ -w . ] || e=🔒
printf %s%s "$e" "$(printf %s "$p" | sed -E 's#(\.?[^/])[^/]*/#\1/#g')"
'''
format = '[$output]($style)'
style = 'bold'

# 🍁 dirty / 🌿 clean, like the statusline (git_branch can't switch symbols)
[custom.git_mark]
require_repo = true
when = true
shell = ['sh']
command = 'test -z "$(git status --porcelain 2>/dev/null | head -1)" && printf 🌿 || printf 🍁'
format = '$output'

[git_branch]
format = '[$branch]($style) '
truncation_length = 30

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[line_break]
disabled = true
